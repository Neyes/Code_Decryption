  <style>
:root {
  --bg: #F3F5F2; --surface: #FFFFFF; --surface-2: #F7F9F6; --ink: #15201A; --muted: #5E6B63; --faint: #8C978F; --line: #E2E8E3;
  --accent: #157347; --accent-2: #1F8F59; --accent-soft: #E3F2E9; --on-accent: #FFFFFF;
  --gold: #B98516; --gold-soft: #FBF1D9; --red: #CF3F3F; --red-soft: #FBE7E7; --blue: #2C66D3; --blue-soft: #E5EDFB;
  --shadow: 0 1px 2px rgba(18, 32, 24, .06), 0 6px 18px rgba(18, 32, 24, .06); --radius: 18px; --radius-s: 12px;

  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1411; --surface: #17201B; --surface-2: #1C2620; --ink: #E7EEE9; --muted: #A1AEA6; --faint: #75837A; --line: #26332C;
    --accent: #34A86E; --accent-2: #3FBF7E; --accent-soft: #1C3527; --on-accent: #06140C;
    --gold: #E2B24A; --gold-soft: #33290F; --red: #EF6B6B; --red-soft: #3A1C1C; --blue: #6F9BF0; --blue-soft: #1B2840;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1411; --surface: #17201B; --surface-2: #1C2620; --ink: #E7EEE9; --muted: #A1AEA6; --faint: #75837A; --line: #26332C;
  --accent: #34A86E; --accent-2: #3FBF7E; --accent-soft: #1C3527; --on-accent: #06140C;
  --gold: #E2B24A; --gold-soft: #33290F; --red: #EF6B6B; --red-soft: #3A1C1C; --blue: #6F9BF0; --blue-soft: #1B2840;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font-body); word-break: keep-all; overflow-wrap: anywhere; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 25; background: var(--bg); }
h1, h2, h3 { text-wrap: balance; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4, p { margin: 0; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.boot { min-height: 100vh; display: grid; place-items: center; color: var(--muted); }
.shell { max-width: 520px; margin: 0 auto; min-height: 100vh; padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 10px; padding: 14px 0 10px; background: linear-gradient(var(--bg) 75%, transparent); }
.appbar h1 { font-size: 19px; font-weight: 800; letter-spacing: -.02em; display: flex; align-items: center; gap: 8px; }
.appbar h1 .logo { width: 30px; height: 30px; border-radius: 9px; background: var(--accent-soft); display: grid; place-items: center; }
.appbar h1 .logo .px { width: 24px; height: 24px; }
.appbar .spacer { flex: 1; }
.icon-btn { width: 38px; height: 38px; border-radius: 12px; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; }
.icon-btn:hover { background: var(--surface); color: var(--ink); }
.money-chip { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px 6px 8px; font-size: 13px; font-weight: 700; }
.money-chip .ic { width: 18px; height: 18px; color: var(--accent); }
.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; margin: 12px 0; }
.card.flat { box-shadow: none; border: 1px solid var(--line); }
.card h2 { font-size: 17px; font-weight: 800; letter-spacing: -.01em; }
.card h3 { font-size: 15px; font-weight: 800; }
.eyebrow { font-size: 12.5px; color: var(--muted); font-weight: 600; letter-spacing: .01em; }
.muted { color: var(--muted); } .faint { color: var(--faint); } .small { font-size: 13px; } .tiny { font-size: 12px; }
.row { display: flex; align-items: center; gap: 12px; } .row.between { justify-content: space-between; } .grow { flex: 1; min-width: 0; }
.stack > * + * { margin-top: 10px; }
.big { font-size: 34px; font-weight: 900; letter-spacing: -.03em; line-height: 1.1; }
.accent { color: var(--accent); } .up { color: var(--red); } .down { color: var(--blue); } .gold { color: var(--gold); }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.pill.green { background: var(--accent-soft); color: var(--accent); border-color: transparent; } .pill.gold { background: var(--gold-soft); color: var(--gold); border-color: transparent; }
.pill.red { background: var(--red-soft); color: var(--red); border-color: transparent; } .pill.blue { background: var(--blue-soft); color: var(--blue); border-color: transparent; }
.primary, .secondary, .ghost { border: 0; border-radius: 14px; padding: 15px 18px; font-weight: 800; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
.primary { background: var(--accent); color: var(--on-accent); }
.primary:hover { background: var(--accent-2); }
.primary:disabled { opacity: .45; cursor: not-allowed; }
.secondary { background: var(--accent-soft); color: var(--accent); }
.ghost { background: transparent; color: var(--muted); font-weight: 700; font-size: 14px; padding: 10px; }
.dock { position: sticky; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 15; padding: 12px 0 6px; background: linear-gradient(transparent, var(--bg) 35%); }
.dock .hint { text-align: center; font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
/* 하단 탭 */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.tabbar nav { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { border: 0; background: transparent; padding: 9px 0 8px; display: grid; justify-items: center; gap: 2px; font-size: 11.5px; font-weight: 700; color: var(--faint); position: relative; }
.tab.active { color: var(--accent); }
.tab .dot { position: absolute; top: 6px; right: calc(50% - 16px); width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
/* 프로필 */
.hero { display: flex; gap: 14px; align-items: center; }
.hero .avatar { border-radius: 18px; flex: none; }
.hero .name { font-size: 20px; font-weight: 900; letter-spacing: -.02em; }
.ovr { text-align: right; }
.ovr b { display: block; font-size: 36px; line-height: 1; font-weight: 900; letter-spacing: -.04em; }
.ovr small { font-size: 12px; color: var(--muted); font-weight: 700; }
.tier { font-size: 12px; font-weight: 800; color: var(--accent); }
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat-grid.four { grid-template-columns: repeat(4, 1fr); }
.stat { background: var(--surface-2); border-radius: var(--radius-s); padding: 10px 8px; text-align: center; }
.stat b { display: block; font-size: 20px; font-weight: 900; letter-spacing: -.03em; line-height: 1.2; }
.stat span { font-size: 11.5px; color: var(--muted); font-weight: 600; }
/* 할 일 목록 */
.todo { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 0; background: transparent; padding: 13px 2px; border-top: 1px solid var(--line); }
.todo:first-of-type { border-top: 0; }
.todo .badge { width: 40px; height: 40px; border-radius: 13px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.todo .badge.gold { background: var(--gold-soft); color: var(--gold); } .todo .badge.red { background: var(--red-soft); color: var(--red); } .todo .badge.blue { background: var(--blue-soft); color: var(--blue); }
.todo strong { display: block; font-size: 15px; } .todo small { color: var(--muted); font-size: 13px; }
.todo .new { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
.todo .ic.chev { color: var(--faint); }
/* 시즌 진행 */
.segments { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin: 10px 0 4px; }
.segments i { height: 6px; border-radius: 3px; background: var(--line); }
.segments i.done { background: var(--accent); } .segments i.now { background: var(--gold); }
.seg-labels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; font-size: 10.5px; color: var(--faint); text-align: center; }
.field { display: block; width: 100%; height: auto; border-radius: 14px; }
.choice { display: block; width: 100%; text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-top: 10px; }
.choice:hover { border-color: var(--accent); background: var(--accent-soft); }
.choice strong { display: block; font-size: 15.5px; }
.choice .chance { font-size: 13px; color: var(--accent); font-weight: 800; margin-top: 3px; }
.choice .hint { font-size: 12.5px; color: var(--muted); }
.result-box { border-radius: 16px; padding: 14px 16px; background: var(--accent-soft); }
.result-box.fail { background: var(--red-soft); }
.result-box .verdict { font-weight: 900; font-size: 18px; }
.roll { height: 10px; border-radius: 5px; background: var(--red-soft); position: relative; overflow: hidden; margin: 10px 0 6px; }
.roll span { position: absolute; inset: 0 auto 0 0; background: var(--accent); opacity: .65; }
.roll i { position: absolute; top: -3px; width: 3px; height: 16px; background: var(--ink); border-radius: 2px; }
.lines { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
/* 능력치 */
.attr { display: grid; grid-template-columns: 74px 1fr 52px; align-items: center; gap: 10px; padding: 7px 0; }
.attr .bar { height: 9px; border-radius: 5px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--line); }
.attr .bar span { display: block; height: 100%; background: var(--faint); border-radius: 5px; }
.attr.focus .bar span { background: var(--accent); }
.attr .v { text-align: right; font-weight: 900; font-variant-numeric: tabular-nums; }
.attr .v small { font-size: 11px; font-weight: 800; margin-left: 2px; }
.attr label { font-weight: 700; font-size: 14px; }
.attr.focus label { color: var(--accent); }
.meter { display: grid; grid-template-columns: 84px 1fr 34px; gap: 10px; align-items: center; font-size: 13.5px; padding: 4px 0; }
.meter .bar { height: 7px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.meter .bar span { display: block; height: 100%; background: var(--blue); }
/* 표 */
.table-wrap { overflow-x: auto; margin: 0 -4px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 6px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 700; font-size: 12px; }
th:first-child, td:first-child, td.l, th.l { text-align: left; }
tr.mine td { background: var(--accent-soft); font-weight: 800; }
.res-w { color: var(--accent); font-weight: 900; } .res-l { color: var(--red); font-weight: 900; }
/* 트로피 */
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.trophy { background: var(--gold-soft); border-radius: 14px; padding: 10px 8px; text-align: center; }
.trophy .ic { width: 26px; height: 26px; color: var(--gold); }
.trophy b { display: block; font-size: 18px; font-weight: 900; }
.trophy span { font-size: 11.5px; font-weight: 700; color: var(--muted); }
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { display: grid; grid-template-columns: 48px 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.timeline li b { color: var(--accent); font-variant-numeric: tabular-nums; }
/* 반응 */
.post { border-top: 1px solid var(--line); padding: 12px 0; }
.post:first-child { border-top: 0; }
.headline { font-weight: 800; font-size: 15.5px; margin: 4px 0 8px; }
.comment { display: grid; grid-template-columns: 32px 1fr auto; gap: 10px; padding: 8px 0; }
.comment .face { width: 32px; height: 32px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-weight: 800; font-size: 13px; color: var(--muted); }
.comment .meta { font-size: 11.5px; color: var(--faint); }
.comment .likes { font-size: 12px; color: var(--faint); }
.spark { width: 100%; height: auto; }
.spark-line { fill: none; stroke: var(--accent); stroke-width: 2.4; } .spark-fill { fill: var(--accent-soft); } .spark-dot { fill: var(--accent); }
/* 시트 */
.backdrop { position: fixed; inset: 0; z-index: 50; background: var(--scrim); padding-top: env(safe-area-inset-top, 0px); display: flex; align-items: flex-end; justify-content: center; animation: fade .15s ease-out; }
.sheet { width: 100%; max-width: 520px; max-height: 92vh; overflow: auto; background: var(--surface); border-radius: 24px 24px 0 0; padding-block: 20px calc(18px + env(safe-area-inset-bottom, 0px)); padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); animation: up .22s ease-out; }
.sheet .close { position: sticky; top: 0; float: right; margin: -6px -6px 0 0; }
.sheet h2 { font-size: 22px; font-weight: 900; letter-spacing: -.02em; line-height: 1.3; }
.sheet .lead { color: var(--muted); margin-top: 6px; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
.kv span { color: var(--muted); } .kv b { text-align: right; }
.growth-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.growth-grid .g { background: var(--surface-2); border-radius: 14px; padding: 10px; text-align: center; }
.growth-grid .g b { display: block; font-size: 26px; font-weight: 900; letter-spacing: -.03em; }
.growth-grid .g.focus b { color: var(--accent); }
.growth-grid .g small { font-size: 12px; font-weight: 800; }
.option { display: block; width: 100%; text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 16px; padding: 14px 16px; margin-top: 10px; }
.option.sel { border-color: var(--accent); background: var(--accent-soft); }
.option strong { font-size: 15.5px; } .option .sub { font-size: 13px; color: var(--muted); margin-top: 2px; } .option .desc { font-size: 13px; margin-top: 6px; }
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); opacity: 0; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 700; z-index: 70; transition: .2s; max-width: calc(100% - 32px); pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%); }
/* 중계 */
.scoreboard { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; background: var(--board); color: var(--board-ink); border-radius: 18px; padding: 16px; text-align: center; }
.scoreboard b { font-size: 40px; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
.scoreboard small { display: block; font-size: 12px; opacity: .75; font-weight: 700; }
.scoreboard .q { font-size: 12px; background: var(--board-flag); color: var(--board); border-radius: 8px; padding: 2px 8px; font-weight: 900; }
.pbp { list-style: none; padding: 0; margin: 12px 0 0; max-height: 46vh; overflow: auto; }
.pbp li { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; display: grid; grid-template-columns: 56px 1fr; gap: 8px; animation: fade .3s; }
.pbp li.score { font-weight: 800; } .pbp li.mine { color: var(--accent); } .pbp li time { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
/* 생성 화면 */
.steps { display: flex; gap: 6px; margin: 6px 0 14px; }
.steps i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); } .steps i.on { background: var(--accent); }
.setup h2 { font-size: 26px; font-weight: 900; letter-spacing: -.03em; line-height: 1.25; }
.field-row { margin-top: 16px; }
.field-row > label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
input[type=text], input[type=number], select { width: 100%; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; font-size: 16px; }
input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 12px; font-weight: 700; font-size: 14px; }
.seg button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.pos-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.pos-grid button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 4px; display: grid; gap: 0; }
.pos-grid button b { font-size: 16px; font-weight: 900; } .pos-grid button span { font-size: 11px; color: var(--muted); }
.pos-grid button.on { border-color: var(--accent); background: var(--accent-soft); } .pos-grid button.on b { color: var(--accent); }
.cand { border: 1.5px solid var(--line); background: var(--surface); border-radius: 18px; padding: 14px 16px; width: 100%; text-align: left; margin-top: 10px; }
.cand.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.cand .mini { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-top: 10px; }
.cand .mini div { text-align: center; } .cand .mini b { display: block; font-size: 16px; font-weight: 900; } .cand .mini span { font-size: 10.5px; color: var(--muted); }
.avatar-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.avatar-grid button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 16px; padding: 6px; display: grid; place-items: center; }
.avatar-grid button.on { border-color: var(--accent); background: var(--accent-soft); }
.footer { text-align: center; font-size: 12px; color: var(--faint); padding: 24px 0 8px; }
.footer a { color: var(--muted); }
@keyframes up { from { transform: translateY(40px); opacity: .6; } }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.08); } }
.pop { animation: pop .45s ease-out both; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
@media (max-width: 380px) { .stat-grid.four { grid-template-columns: repeat(2, 1fr); } .big { font-size: 30px; } }

/* 숫자는 경기장 전광판처럼 좁은 고딕 */
.big, .ovr b, .stat b, .scoreboard b, .growth-grid .g b, .trophy b, .pos-grid button b, .cand .mini b, .money-chip, .attr .v, .meter b, table { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.ovr b, .scoreboard b, .growth-grid .g b { font-weight: 800; letter-spacing: 0; }
.stat b { font-size: 22px; font-weight: 700; letter-spacing: 0; }
table { font-size: 14px; } td.l, th.l, .tiny { font-family: var(--font-body); }

/* 픽셀 아트 */
.px { image-rendering: pixelated; display: block; max-width: 100%; }
.px.scene { width: 100%; height: auto; aspect-ratio: 160 / 84; border-radius: 14px; background: var(--surface-2); }
.px.portrait { border-radius: 16px; background: var(--accent-soft); flex: none; }
.px.icon { width: 30px; height: 30px; margin: 0 auto; }
.trophy .px.icon { width: 34px; height: 34px; }
.avatar-stage { display: flex; justify-content: center; align-items: flex-end; gap: 18px; }
.avatar-stage .sprite { flex: none; }
.hero-scene { padding: 10px; }
.px-anim { position: relative; }
.px-anim .f2 { position: absolute; inset: 0; animation: frame2 .9s steps(1) infinite; }
@keyframes frame2 { 0% { opacity: 0; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .px-anim .f2 { display: none; } }

/* ───────── 연출 오버레이 ───────── */
.fx { position: fixed; inset: 0; z-index: 90; overflow: auto; animation: fade .2s ease-out; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.fx.dark { background: var(--board); color: var(--board-ink); }
.fx.light { background: var(--bg); color: var(--ink); }
.fx-canvas { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; pointer-events: none; z-index: 1; }
.fx-body { position: relative; z-index: 2; max-width: 480px; margin: 0 auto; min-height: 100%; display: grid; align-content: center; gap: 6px; text-align: center; padding-block: 56px 32px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
.fx h2 { font-size: 28px; font-weight: 900; letter-spacing: -.02em; line-height: 1.25; }
.fx .lead { opacity: .82; margin-top: 4px; }
.fx.dark .eyebrow { color: var(--board-flag); }
.fx-skip { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); z-index: 3; border: 0; border-radius: 999px; padding: 8px 14px; background: rgba(255, 255, 255, .14); color: inherit; font-weight: 800; font-size: 13px; }
.fx.light .fx-skip { background: var(--surface-2); }
.fx .scene { border-radius: 14px; }
/* 시즌 진행 */
.fx-season { text-align: left; }
.fx-season h2, .fx-season .eyebrow { text-align: left; }
.fx-wl { font-family: var(--font-num); font-size: 18px; margin-top: 4px; } .fx-wl b { font-size: 34px; font-weight: 800; }
.fx-progress { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .15); overflow: hidden; margin: 8px 0 10px; }
.fx-progress i { display: block; height: 100%; width: 100%; background: var(--board-flag); transform-origin: left; animation: grow linear both; }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.fx-games { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.fx-games li { display: grid; grid-template-columns: 52px 1fr 40px; gap: 8px; align-items: center; background: rgba(255, 255, 255, .07); border-radius: 12px; padding: 8px 10px; font-size: 14px; opacity: 0; animation: slideIn .3s ease-out both; }
.fx-games li.win .grow b { color: #7FE0A0; } .fx-games li.loss .grow b { color: #FF9A9A; }
.fx-games li.big { outline: 2px solid var(--board-flag); }
.fx-games li small { display: block; opacity: .7; font-size: 12px; }
.fx-games .tag { font-size: 11.5px; opacity: .75; font-weight: 700; }
.fx-games .gr { font-family: var(--font-num); font-weight: 800; font-size: 18px; text-align: right; }
@keyframes slideIn { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
/* 성장 공개 */
.fx-growth h2 { font-family: var(--font-num); font-size: 40px; }
.fx-growth h2 .ovr-to { color: var(--accent); }
.fx-growth .growth-grid .g { animation: pop .45s ease-out both; }
.fx-growth .g b.done { animation: pop .3s ease-out; }
.fx-growth .g em { display: block; font-style: normal; font-weight: 800; font-size: 12px; }
.fx-tag { display: inline-block; margin: 8px auto 0; padding: 6px 12px; border-radius: 999px; background: var(--red-soft); color: var(--red); font-weight: 800; font-size: 13px; }
.fx-tag.green { background: var(--accent-soft); color: var(--accent); }
/* 세리머니 */
.fx-ceremony { position: relative; }
.fx-ceremony .spot { position: absolute; left: 50%; top: -60px; width: 320px; height: 420px; transform: translateX(-50%); background: radial-gradient(ellipse at top, rgba(255, 240, 180, .35), transparent 65%); pointer-events: none; }
.fx-trophy { width: 120px; height: 120px; margin: 0 auto; animation: drop .9s cubic-bezier(.3, 1.6, .5, 1) both; }
.fx-hero { width: 110px; height: 140px; margin: 0 auto; animation: rise .7s .4s ease-out both; }
@keyframes drop { from { transform: translateY(-160px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes rise { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.fx-ceremony h2 { animation: pop .5s .6s ease-out both; color: var(--board-flag); }
/* 타이틀 카드 */
.fx-title .year { font-family: var(--font-num); font-size: 96px; font-weight: 800; line-height: 1; color: var(--board-flag); animation: zoomIn .6s cubic-bezier(.2, 1.4, .4, 1) both; }
.fx-title h2 { animation: fadeUp .5s .35s both; }
.fx-title .scene { animation: fadeUp .5s both; }
@keyframes zoomIn { from { transform: scale(2.2); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fadeUp { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
/* 드래프트 */
.fx-draft .pick-in span { display: inline-block; font-family: var(--font-num); font-weight: 800; font-size: 28px; letter-spacing: .08em; padding: 10px 16px; border: 2px solid var(--board-flag); color: var(--board-flag); animation: blink .4s steps(1) 4, fadeOutUp .3s 1.6s forwards; }
.fx-draft .reveal { margin-top: 6px; padding: 16px; border-radius: 16px; background: var(--team); color: #fff; opacity: 0; animation: pop .5s 1.8s cubic-bezier(.2, 1.5, .4, 1) forwards; text-shadow: 0 1px 2px rgba(0, 0, 0, .5); }
.fx-draft .reveal h2 { font-size: 30px; }
.fx-draft .reveal-scene { margin-top: 10px; opacity: 0; animation: fadeUp .5s 2.1s forwards; }
@keyframes blink { 50% { opacity: 0; } }
@keyframes fadeOutUp { to { opacity: 0; transform: translateY(-10px); height: 0; padding: 0; margin: 0; } }
/* 계약서 */
.fx-sign .paper { background: #FBF7EE; color: #2A2320; border-radius: 10px; padding: 18px; text-align: left; position: relative; transform: rotate(-1.5deg); border-top: 8px solid var(--team); animation: rise .5s both; }
.fx-sign .paper .kv span { color: #7A6A5A; } .fx-sign .paper .kv { border-color: #E6DCCB; }
.fx-sign .sig { width: 70%; height: 50px; margin-top: 10px; }
.fx-sign .sig path { fill: none; stroke: #1E3A8A; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 420; stroke-dashoffset: 420; animation: draw 1.2s .5s ease-in-out forwards; }
.fx-sign .stamp { position: absolute; right: 16px; bottom: 18px; border: 3px solid #C83A3A; color: #C83A3A; font-weight: 900; padding: 4px 10px; border-radius: 8px; transform: rotate(-12deg) scale(2); opacity: 0; animation: stamp .3s 1.8s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes stamp { to { transform: rotate(-12deg) scale(1); opacity: 1; } }
/* 부상 */
.fx-injury .flash { position: fixed; inset: 0; background: #C83A3A; opacity: 0; animation: flash .7s ease-out; pointer-events: none; }
.fx-injury h2 { color: #FF9A9A; }
@keyframes flash { 0% { opacity: .65; } 100% { opacity: 0; } }
/* 은퇴식 */
.fx-retire .banner { margin: 8px auto 0; width: 150px; padding: 18px 10px 26px; background: var(--board-flag); color: var(--board); clip-path: polygon(0 0, 100% 0, 100% 86%, 50% 100%, 0 86%); animation: rise 1.2s ease-out both; }
.fx-retire .banner b { display: block; font-family: var(--font-num); font-size: 72px; line-height: 1; }
.fx-retire .banner span { font-weight: 800; font-size: 13px; }
/* 카드 뽑기 */
.fx-gacha .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-top: 10px; perspective: 600px; }
.gcard { position: relative; height: 150px; transform-style: preserve-3d; animation: flip .6s ease-out both; }
.gcard .back, .gcard .front { position: absolute; inset: 0; border-radius: 14px; backface-visibility: hidden; display: grid; align-content: center; gap: 4px; padding: 10px; }
.gcard .back { background: repeating-linear-gradient(45deg, #2B3346 0 6px, #232A3B 6px 12px); transform: rotateY(180deg); }
.gcard .front { background: #2B3346; border: 2px solid #8A93A6; }
.gcard .front small { font-weight: 900; } .gcard .front b { font-size: 14px; } .gcard .front span { font-size: 11.5px; opacity: .8; }
.gcard.rare .front { border-color: #5AB4F0; box-shadow: 0 0 14px rgba(90, 180, 240, .5); } .gcard.rare small { color: #5AB4F0; }
.gcard.epic .front { border-color: #B07CF0; box-shadow: 0 0 18px rgba(176, 124, 240, .6); } .gcard.epic small { color: #C9A2FF; }
.gcard.legend .front { border-color: #F2C230; box-shadow: 0 0 24px rgba(242, 194, 48, .8); } .gcard.legend small { color: #F2C230; }
@keyframes flip { from { transform: rotateY(180deg); } to { transform: rotateY(0); } }
/* VS · 결과 */
.fx-vs .vs-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; margin-top: 10px; }
.fx-vs .vs-row span { background: var(--team); color: #fff; border-radius: 12px; padding: 12px 8px; font-weight: 900; text-shadow: 0 1px 2px rgba(0, 0, 0, .5); }
.fx-vs .vs-row span:first-child { animation: fromLeft .5s both; } .fx-vs .vs-row span:last-child { animation: fromRight .5s both; }
.fx-vs .vs-row b { font-family: var(--font-num); font-size: 34px; color: var(--board-flag); animation: pop .4s .45s both; }
@keyframes fromLeft { from { transform: translateX(-80px); opacity: 0; } } @keyframes fromRight { from { transform: translateX(80px); opacity: 0; } }
.fx-result .score { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; margin-top: 6px; }
.fx-result .score b { font-family: var(--font-num); font-size: 48px; font-weight: 800; }
.fx-result.win h2 { color: var(--board-flag); } .fx-result.loss h2 { color: #FF9A9A; }

/* ───────── 직접 플레이 ───────── */
.clutch { position: fixed; inset: 0; z-index: 85; background: var(--board); color: var(--board-ink); display: flex; flex-direction: column; overflow: hidden; padding-block: calc(4px + env(safe-area-inset-top, 0px)) env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.clutch > * { width: 100%; max-width: 520px; margin-left: auto; margin-right: auto; }
/* 위: 한 줄짜리 전광판 */
.cl-top { flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; padding: 2px 10px 6px; }
.cl-team { display: flex; align-items: center; gap: 7px; min-width: 0; }
.cl-team.opp { flex-direction: row-reverse; text-align: right; }
.cl-team b { font-family: var(--font-num); font-size: 30px; font-weight: 800; line-height: 1; }
.cl-team small { font-size: 11.5px; opacity: .8; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cl-mid { display: grid; gap: 1px; justify-items: center; text-align: center; }
.cl-tags { display: flex; gap: 4px; align-items: center; }
.cl-q { background: var(--board-flag); color: var(--board); border-radius: 6px; padding: 1px 7px; font-weight: 900; font-size: 11.5px; }
.cl-mid small { font-family: var(--font-num); font-size: 13px; white-space: nowrap; }
.cl-title { font-style: normal; font-size: 11px; font-weight: 800; color: var(--board-flag); max-width: 46vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* 가운데: 필드가 남은 화면을 모두 씁니다 */
.cl-stage { position: relative; flex: 1 1 auto; min-height: 240px; overflow: hidden; }
.cl-live { position: absolute; inset: 0; display: flex; justify-content: center; align-items: flex-start; overflow: hidden; }
.cl-live canvas { display: block; flex: none; image-rendering: pixelated; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
/* 아래: 고를 때만 필드 위에 뜨는 패널 */
.cl-panel { position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; padding: 26px 10px 8px; background: linear-gradient(rgba(16, 24, 20, 0), rgba(16, 24, 20, .88) 24px, rgba(16, 24, 20, .95)); }
.cl-msg { margin: 0 2px 8px; font-size: 14px; line-height: 1.45; text-shadow: 0 1px 2px rgba(0, 0, 0, .6); }
.cl-msg:empty { display: none; }
.cl-actions { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.pb { min-width: 0; }
.cl-auto { display: block; margin: 6px auto 0; border: 0; background: transparent; color: inherit; opacity: .6; font-size: 12.5px; font-weight: 700; padding: 6px 10px; }
.clutch .choice { margin-top: 0; background: rgba(255, 255, 255, .07); border-color: rgba(255, 255, 255, .16); color: inherit; padding: 11px 14px; }
.clutch .choice:hover { background: rgba(255, 255, 255, .14); border-color: var(--board-flag); }
.clutch .choice .hint { color: inherit; opacity: .7; }
.clutch .ghost { color: inherit; opacity: .7; }
/* 빅게임 카드 · 주사위 */
.big-card .vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; text-align: center; margin-top: 10px; }
.big-card .vs b { font-family: var(--font-num); font-size: 22px; }
.big-card .vs span { font-weight: 800; }
.roll.anim i { animation: needle 1.2s cubic-bezier(.2, .9, .3, 1) both; }
@keyframes needle { 0% { left: 0; } 30% { left: 92%; } 55% { left: 12%; } 75% { left: 70%; } 100% { left: var(--to); } }
.result-box.reveal { animation: fadeUp .4s 1.15s both; }
.scene.reveal { animation: fadeUp .4s 1.2s both; }
.badge-pop { position: fixed; left: 50%; top: calc(70px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 95; background: var(--board); color: var(--board-flag); border: 2px solid var(--board-flag); border-radius: 14px; padding: 10px 16px; font-weight: 900; animation: pop .4s ease-out, fadeOutUp .4s 2.4s forwards; pointer-events: none; }
.title-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.title-chip { border-radius: 12px; padding: 10px; background: var(--surface-2); border: 1px solid var(--line); }
.title-chip b { display: block; font-size: 14px; } .title-chip span { font-size: 11.5px; color: var(--muted); }
.title-chip.got { background: var(--gold-soft); border-color: transparent; } .title-chip.got b { color: var(--gold); }
.title-chip:not(.got) b { color: var(--faint); }
.pane-tabs { display: flex; gap: 6px; margin-bottom: 4px; }
.pane-tabs button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: 13px; }
.pane-tabs button.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
@media (prefers-reduced-motion: reduce) { .roll.anim i { left: var(--to); } .result-box.reveal, .scene.reveal { animation: none; } }

/* 실시간 플레이 */
.cl-live-tag { display: inline-block; padding: 1px 6px; border-radius: 6px; background: #E85A5A; color: #fff; font-size: 11px; font-weight: 900; letter-spacing: .03em; animation: livePulse 1.6s ease-in-out infinite; }
@keyframes livePulse { 50% { opacity: .55; } }
/* 필드 위 조작: 왼쪽 아날로그 스틱, 오른쪽 스킬 버튼 */
.lp-tip { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 3; width: max-content; max-width: calc(100% - 24px); background: rgba(0, 0, 0, .62); border-radius: 10px; padding: 6px 11px; font-size: 12.5px; font-weight: 700; text-align: center; pointer-events: none; animation: fade .2s; }
.lp-ctrl { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.lp-zone { position: absolute; left: 0; bottom: 0; width: 46%; height: 38%; pointer-events: auto; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.lp-stick { position: absolute; left: 14px; bottom: 14px; width: 112px; height: 112px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 255, 255, .1) 0 55%, rgba(255, 255, 255, .2) 56% 60%, rgba(255, 255, 255, .08) 61%); border: 2px solid rgba(255, 255, 255, .35); opacity: .75; transition: opacity .15s; }
.lp-stick.on { opacity: 1; transition: none; }
.lp-stick i { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #FFFFFF, #CFD6DE 60%, #9AA4B0); box-shadow: 0 3px 8px rgba(0, 0, 0, .45); }
.lp-btns { position: absolute; right: 12px; bottom: 14px; width: 150px; height: 150px; }
.lp-btn { position: absolute; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .75); color: #fff; font-weight: 900; font-size: 13px; line-height: 1.15; display: grid; place-items: center; padding: 4px; pointer-events: auto; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; overflow: hidden; text-shadow: 0 1px 2px rgba(0, 0, 0, .7); box-shadow: 0 3px 8px rgba(0, 0, 0, .4); }
.lp-btn span { position: relative; z-index: 1; word-break: keep-all; }
.lp-btn::after { content: ""; position: absolute; inset: 0; background: conic-gradient(rgba(0, 0, 0, .62) calc(var(--cd, 0) * 360deg), transparent 0); }
.lp-btn.b0 { right: 0; bottom: 0; width: 74px; height: 74px; background: #D9483B; font-size: 14px; }
.lp-btn.b1 { right: 82px; bottom: 6px; width: 60px; height: 60px; background: #2F6FD6; }
.lp-btn.b2 { right: 8px; bottom: 82px; width: 60px; height: 60px; background: #1F9A5C; }
.lp-btn.b3 { right: 84px; bottom: 82px; width: 54px; height: 54px; background: #7A54C7; font-size: 12px; }
.lp-btn.off { filter: saturate(.35) brightness(.75); }
/* 플레이북: 분류 탭 + 작전 그림 카드 (가로로 넘기기) */
.pb-tabs { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; margin: 0 -2px 6px; padding: 0 2px; }
.pb-tabs::-webkit-scrollbar { display: none; }
.pb-tabs button { flex: none; border: 1.5px solid rgba(255, 255, 255, .22); background: rgba(255, 255, 255, .08); color: inherit; border-radius: 999px; padding: 5px 11px; font-size: 12.5px; font-weight: 800; touch-action: manipulation; }
.pb-tabs button i { font-style: normal; opacity: .6; font-size: 11px; margin-left: 2px; }
.pb-tabs button.on { background: var(--board-flag); color: var(--board); border-color: var(--board-flag); }
.pb-tabs button.on i { opacity: .75; }
.pb-advice { margin: 0 2px 6px; font-size: 12px; opacity: .85; line-height: 1.4; }
.pb-cards { display: flex; gap: 7px; overflow-x: auto; scroll-snap-type: x proximity; padding-bottom: 4px; scrollbar-width: thin; }
.pb-card { flex: none; width: 118px; scroll-snap-align: start; border: 1.5px solid rgba(255, 255, 255, .18); background: rgba(255, 255, 255, .07); color: inherit; border-radius: 12px; padding: 4px 4px 7px; text-align: left; display: grid; gap: 2px; touch-action: manipulation; }
.pb-card img { display: block; width: 110px; height: 66px; border-radius: 8px; }
.pb-card b { font-size: 13px; font-weight: 800; line-height: 1.25; padding: 2px 3px 0; }
.pb-card small { font-size: 10.5px; opacity: .7; line-height: 1.3; padding: 0 3px; }
.pb-card.rec { border-color: rgba(242, 194, 48, .7); }
.pb-card:hover, .pb-card:active { border-color: var(--board-flag); background: rgba(255, 255, 255, .15); }
.lp-btn.press { transform: scale(.9); }

/* ───────── 헬스장 ───────── */
.clutch.gym { overflow-y: auto; }
.gym-top { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 12px 6px; }
.gym-top b { display: block; font-size: 16px; font-weight: 900; }
.gym-top small { font-size: 12px; opacity: .75; }
.gym-x { border: 1.5px solid rgba(255, 255, 255, .25); background: rgba(255, 255, 255, .08); color: inherit; border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: 13px; }
.clutch > .gym-energy { flex: none; position: relative; height: 18px; width: calc(100% - 24px); max-width: 496px; margin: 0 auto 8px; border-radius: 9px; background: rgba(255, 255, 255, .1); overflow: hidden; }
.gym-energy i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #3FBF7E, #F2C230); transition: width .3s; }
.gym-energy span { position: relative; display: block; text-align: center; font-size: 11.5px; font-weight: 800; line-height: 18px; text-shadow: 0 1px 2px rgba(0, 0, 0, .6); }
.gym-scene { flex: none; display: block; width: 100%; height: auto; aspect-ratio: 240 / 124; image-rendering: pixelated; }
.gym-body { padding: 10px 12px 18px; }
.gym-note { font-size: 12px; opacity: .75; line-height: 1.45; margin: 0 0 8px; }
.gym-list { display: grid; gap: 7px; }
.gym-ex { text-align: left; border: 1.5px solid rgba(255, 255, 255, .18); background: rgba(255, 255, 255, .07); color: inherit; border-radius: 14px; padding: 10px 12px; display: grid; gap: 5px; touch-action: manipulation; }
.gym-ex:disabled { opacity: .5; }
.gym-ex:not(:disabled):hover { border-color: var(--board-flag); }
.gym-ex strong { font-size: 15px; }

    this.view.tip(this.snapCount <= 3 ? (kbd ? HINT_KEY : HINT)[this.control] : (kbd && SNAP_MSG_KEY[this.control]) || SNAP_MSG[this.control] || '스냅!', this.snapCount <= 3 ? 4.5 : 2);

  boxCount() { const d = this.d; return this.view.P.filter(p => p.team === 'D' && Math.abs(p.home.x - CX) < 6.5 && p.home.y < d.ball + 7).length; }
  // 플레이북: 탭(추천·분류) + 작전 그림 카드
  showBook({ kind, list, rec, cats, advice, onPick }) {
    const tabs = [['rec', '추천'], ...cats.filter(([k]) => list.some(p => p.cat === k))];
    const recSet = new Set(rec.map(p => p.id));
    const card = p => {
      const art = kind === 'off' ? playArt(p) : defArt(p, MINE_KEY[this.pos]);
      const sub = kind === 'off' ? FORMATIONS[p.form].name : DEF_FORMS[p.form].name;
      const why = recSet.has(p.id) ? (kind === 'off' ? whyOff(p) : whyDef(p)) : '';
      return `<button class="pb-card${recSet.has(p.id) ? ' rec' : ''}" data-pid="${p.id}"><img src="${art}" alt="" width="110" height="66"><b>${esc(p.name)}</b><small>${esc(sub)}${why ? ` · ${esc(why)}` : ''}</small></button>`;
    };
    const render = tab => {
      const items = tab === 'rec' ? rec : list.filter(p => p.cat === tab);
      this.$('pb-cards').innerHTML = items.map(card).join('');
      this.$('pb-cards').scrollLeft = 0;
      this.root.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
      this.$('pb-advice').hidden = tab !== 'rec';
      this.root.querySelectorAll('[data-pid]').forEach(b => b.onclick = () => onPick(list.find(p => p.id === b.dataset.pid)));
      this.decorate();
    };
    this.actions(`<div class="pb"><div class="pb-tabs">${tabs.map(([k, n]) => `<button data-tab="${k}">${esc(n)}${k === 'rec' ? '' : ` <i>${list.filter(p => p.cat === k).length}</i>`}</button>`).join('')}</div>
      <p class="pb-advice" id="pb-advice">코치: ${esc(advice)}</p><div class="pb-cards" id="pb-cards"></div></div>`);
    this.root.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => render(b.dataset.tab));

    this.view?.setInset(this.$('cl-panel').offsetHeight);

  // 플레이 결과를 한 줄로: 캐치 분류(숏·미디엄·롱 + 캐치 종류), 패스 종류, 런 종류, 상대 작전
  describe(o, offense) {
    const parts = [];
    if (o.catch) { const k = o.catch; parts.push(`${CATCH_KIND_KO[k.kind]} ${o.gain}야드 (공중 ${k.air} + 캐치 후 ${k.yac})`); if (CATCH_TYPE_KO[k.type]) parts.push(CATCH_TYPE_KO[k.type]); if (o.pass) parts.push(PASS_TYPE_KO[o.pass]); }
    else if (o.turnover === 'INT') parts.push(`인터셉트${o.pass ? ` (${PASS_TYPE_KO[o.pass]})` : ''}`);
    else if (o.incomplete) parts.push(o.pass ? `${PASS_TYPE_KO[o.pass]} 인컴플리트` : '패스 인컴플리트');
    else if (o.sack) parts.push(`색 ${-o.gain}야드 손실`);
    else if (o.run) parts.push(`${RUN_KO[o.run.type] || '런'} ${o.gain >= 0 ? `${o.gain}야드` : `${-o.gain}야드 손실`}`);
    else parts.push(o.gain >= 0 ? `${o.gain}야드 전진` : `${-o.gain}야드 손실`);
    if (offense && o.def) parts.push(`상대 수비: ${o.def.cov} (${o.def.form})`);
    if (!offense && o.play) parts.push(`상대 작전: ${o.play.form} ${o.play.name}`);
    return parts.join(' · ');
  }

  // ───────── 드라이브 ─────────
  startDrive() {
    if (this.drive >= this.drivesTotal) return this.finish(false);
    const last = this.drive === this.drivesTotal - 1;
    const [rf, ra] = this.restSoFar(), me = rf + this.pf, op = ra + this.pa;
    const story = this.practice ? '연습 경기 · 기록에 남지 않아요. 마음껏 해 보세요' : last ? (me < op ? '역전이 필요하다! 마지막 드라이브' : me > op ? '승리를 굳힐 마지막 기회' : '동점, 운명의 마지막 드라이브') : ['1쿼터, 첫 번째 결정적 순간', '흐름을 가져올 때', '후반전, 승부처', '4쿼터'][this.quarter() - 1];
    if (this.mode === 'kick') return this.kickSetup(story, last);
    if (this.mode === 'punt') return this.puntSetup(story);
    const start = 20 + Math.floor(R() * 16);
    this.d = { ball: start, down: 1, toGo: 10, first: start + 10, snaps: 0, offense: this.mode === 'offense' };
    this.board(this.dd());
    this.storyLine = `<b>${esc(story)}</b><br>`;
    this.mode === 'offense' ? this.offensePick() : this.defensePick();
  }
  endDrive(text) {
    this.log.push(text);
    this.drive++;
    this.board(this.dd());
    this.msg(esc(text));
    this.actions(`<button class="primary" data-cl="next">${this.practice ? '한 번 더' : this.drive >= this.drivesTotal ? '경기 결과 보기' : '다음 장면'}</button>`);
    this.root.querySelector('[data-cl="next"]').onclick = () => this.startDrive();
  }
  // ───────── 공격 ─────────
  offensePick(note = '') {
    const d = this.d, intro = this.storyLine || ''; this.storyLine = '';
    this.board(this.dd());
    this.aiDef = aiDefPlay({ ...this.sit(), offForm: this.lastForm }); // 상대 수비 작전 (정렬이 필드에 그대로 보임)
    this.preview({ defPlay: this.aiDef.id, offForm: this.lastForm });
    const lead = `${intro}${note ? esc(note) + '<br>' : ''}`;
    if (d.down === 4) {
      const dist = 100 - d.ball + 17;
      const opts = [`<button class="choice" data-go="go"><strong>고! 4번째 다운 승부</strong><div class="hint">${d.toGo}야드를 가야 한다</div></button>`];
      if (dist <= 57) opts.push(`<button class="choice" data-go="fg"><strong>필드골 시도 (${dist}야드)</strong><div class="hint">팀 키커에게 맡긴다</div></button>`);
      opts.push(`<button class="choice" data-go="punt"><strong>펀트</strong><div class="hint">필드 포지션을 지킨다</div></button>`);
      this.msg(`${lead}<b>4th & ${d.toGo}</b> · 감독이 나를 본다. 어떻게 할까?`);
      this.actions(opts.join(''));
      this.root.querySelectorAll('[data-go]').forEach(b => b.onclick = () => {
        const v = b.dataset.go;
        if (v === 'go') { this.msg('승부! 작전을 고르세요.'); return this.callPlay(); }
        if (v === 'fg') { const ok = R() < clamp(.97 - (dist - 20) * .013, .3, .97); if (ok) this.pf += 3; this.pop(ok ? 'GOOD!' : 'NO GOOD', ok ? '#F2C230' : '#E85A5A'); return this.endDrive(ok ? `${dist}야드 필드골 성공` : `${dist}야드 필드골 실패`); }
        this.pop('PUNT', '#FFFFFF'); return this.endDrive('펀트로 공격권을 넘겼다');
      });
      return;
    }
    this.msg(`${lead}${intro ? '우리 공격. ' : ''}작전 카드를 고르면 바로 스냅합니다.`);
    this.callPlay();
  }
  callPlay(twoPt = false) {
    const sit = { ...this.sit(), shell: this.view.shellShown, box: this.boxCount() };
    let list = playsFor(this.pos);
    if (twoPt) list = list.filter(p => ['short', 'run', 'pa'].includes(p.cat) || p.form === 'goal');
    this.showBook({ kind: 'off', list, rec: suggestOff(list, sit), cats: OFF_CATS, advice: offAdvice(sit), onPick: p => { this.lastForm = p.form; this.snapLive({ play: p.id }).then(o => twoPt ? this.resolveTwo(o) : this.resolveLive(o)); } });
  }
  resolveLive(o) {
    const d = this.d;
    this.mergeStats(o.stats);
    let zone = o.td || o.gain >= 15 ? 'perfect' : (!o.incomplete && !o.turnover && !o.sack && (o.gain >= Math.min(d.toGo, 5))) ? 'good' : 'miss';
    if (this.pos === 'OL') zone = o.stats?.sa ? 'miss' : o.stats?.pan || o.td ? 'perfect' : o.turnover ? 'miss' : 'good';
    this.snap(zone, !!o.td, !!o.turnover);
    const text = this.describe(o, true);
    if (o.turnover) { this.pop(o.turnover === 'INT' ? 'INTERCEPTED' : 'FUMBLE', '#E85A5A'); return this.endDrive(`${o.turnover === 'INT' ? '공격권을 잃었다' : '펌블! 공격권을 잃었다'} · ${text}`); }
    if (o.td) { this.pf += 6; this.tdText = text; return this.afterTD(); }
    if (!o.incomplete) d.ball = clamp(d.ball + o.gain, 1, 99);
    d.snaps++;
    if (d.ball >= d.first) { d.down = 1; d.toGo = Math.min(10, 100 - d.ball); d.goal = 100 - d.ball <= 10; d.first = d.ball + d.toGo; }
    else { d.down++; d.toGo = d.first - d.ball; }
    if (d.down > 4) { this.pop('TURNOVER', '#E85A5A'); return this.endDrive(`4번째 다운 실패, 공격권 넘김 · ${text}`); }
    if (d.snaps >= 9) { const dist = 100 - d.ball + 17; if (dist <= 50 && R() < .8) { this.pf += 3; this.pop('FG GOOD', '#F2C230'); return this.endDrive(`시간에 쫓겨 ${dist}야드 필드골`); } return this.endDrive('시간이 다 됐다'); }
    this.offensePick(text);
  }
  afterTD() {
    this.board(this.dd());
    this.msg(`<b>터치다운!</b> ${esc(this.tdText || '')}<br>추가 득점은?`);
    this.actions(`<button class="choice" data-x="pat"><strong>PAT (1점)</strong><div class="hint">거의 확실하다</div></button><button class="choice" data-x="two"><strong>2점 컨버전</strong><div class="hint">2야드에서 한 번 더 승부</div></button>`);
    this.root.querySelector('[data-x="pat"]').onclick = () => { const ok = R() < .95; if (ok) this.pf += 1; this.pop(ok ? 'PAT GOOD' : 'PAT MISS', ok ? '#F2C230' : '#E85A5A'); this.endDrive(ok ? '터치다운 + PAT' : '터치다운, PAT 실패'); };
    this.root.querySelector('[data-x="two"]').onclick = () => {
      this.saveD = this.d; this.d = { ...this.d, ball: 98, down: 1, toGo: 2, first: 100, goal: true, twoPt: true };
      this.aiDef = aiDefPlay(this.sit());
      this.preview({ defPlay: this.aiDef.id, offForm: this.lastForm });
      this.msg('2점 컨버전! 골라인 작전을 고르세요.');
      this.callPlay(true);
    };
  }
  resolveTwo(o) {
    this.d = this.saveD; const ok = !!o.td; this.mergeStats(o.stats); if (ok) this.pf += 2; this.snap(ok ? 'perfect' : 'miss', ok, false);
    this.pop(ok ? '2 POINTS!' : 'NO GOOD', ok ? '#F2C230' : '#E85A5A', ok); this.endDrive(ok ? '터치다운 + 2점 컨버전 성공' : '터치다운, 2점 컨버전 실패');
  }
  // ───────── 수비 ─────────
  defensePick(note = '') {
    const d = this.d, intro = this.storyLine || ''; this.storyLine = '';
    const sit = this.sit();
    this.aiOff = aiOffPlay(sit); // 상대 공격 작전 (포메이션이 필드에 그대로 보임)
    sit.offForm = this.aiOff.form;
    this.board(this.dd());
    this.preview({ offPlay: this.aiOff.id, defForm: this.lastDefForm });
    this.msg(`${intro}${note ? esc(note) + '<br>' : ''}상대 포메이션: <b>${esc(FORMATIONS[this.aiOff.form].name)}</b>. 수비 작전을 고르면 스냅.`);
    const list = defPlaysFor(this.pos);
    this.showBook({ kind: 'def', list, rec: suggestDef(list, sit), cats: DEF_CATS, advice: defAdvice(sit), onPick: p => { this.lastDefForm = p.form; this.snapLive({ defPlay: p.id }).then(o => this.resolveLiveDefense(o)); } });
  }
  resolveLiveDefense(o) {
    const d = this.d;
    this.mergeStats(o.stats);
    const mine = o.stats || {}, big = mine.sack || mine.dint || mine.tfl || mine.ff;
    const zone = big || o.turnover ? 'perfect' : (o.incomplete || o.gain <= 3) ? 'good' : 'miss';
    this.snap(zone, !!big, !!o.td, !!o.turnover);
    const text = this.describe(o, false);
    if (o.turnover) { if (o.pickSix) this.pf += 7; this.pop(o.pickSix ? 'PICK SIX!' : 'TAKEAWAY!', '#F2C230', true); return this.endDrive(`${o.turnover === 'INT' ? (o.pickSix ? '픽식스!' : '인터셉트로 공격권을 빼앗았다') : '펌블을 유도해 공격권을 빼앗았다'} · ${text}`); }
    if (o.td) { this.pa += 7; return this.endDrive(`터치다운을 허용했다 · ${text}`); }
    if (!o.incomplete) d.ball = clamp(d.ball + o.gain, 1, 99);
    d.snaps++;
    if (d.ball >= d.first) { d.down = 1; d.toGo = Math.min(10, 100 - d.ball); d.goal = 100 - d.ball <= 10; d.first = d.ball + d.toGo; }
    else { d.down++; d.toGo = d.first - d.ball; }
    if (d.down === 4 || d.snaps >= 8) {
      const dist = 100 - d.ball + 17;
      if (dist <= 52) { const ok = R() < clamp(.95 - (dist - 20) * .012, .4, .95); if (ok) this.pa += 3; this.pop(ok ? 'FG GOOD' : 'FG MISS', ok ? '#E85A5A' : '#F2C230'); return this.endDrive(ok ? `상대 ${dist}야드 필드골` : `상대 ${dist}야드 필드골 실패`); }
      if (d.toGo <= 2 && d.ball >= 45 && R() < .5) return this.defensePick(`${text} · 상대가 4번째 다운에 승부를 건다!`);
      this.pop('STOP!', '#F2C230', true); return this.endDrive('수비 성공, 상대 펀트');
    }
    this.defensePick(text);
  }
  mergeStats(st = {}) { for (const [k, v] of Object.entries(st)) inc(this.line, k, v); }
  // ───────── 키커 ─────────
  kickSetup(story, last) {
    const dists = this.final ? [36, 44, 49, 53] : [33, 42, 48];
    const dist = dists[this.drive] ?? 45;
    const wind = Math.round((R() - .5) * 24 * this.D.kick.wind);
    this.d = { ball: 100 - (dist - 17), down: 4, toGo: 3, first: 103, goal: false };
    this.board(`${dist}야드 필드골`);
    this.clearView();
    this.view = new KickPlay(this.$('cl-live'), { mode: 'fg', dist, wind, last, me: { attrs: this.p.attrs, ovr: this.p.ovr }, colors: this.me.colors, oppColors: this.oppColors, diff: this.D.kick });
    this.msg(`<b>${esc(story)}</b><br>${dist}야드 필드골. 바람 ${wind === 0 ? '없음' : `${wind > 0 ? '오른쪽 →' : '← 왼쪽'} ${Math.abs(wind)}km/h`}. 스냅 뒤 러셔가 오기 전에 차세요.`);
    this.actions(`<button class="primary" data-cl="snap">스냅!</button>`);
    this.root.querySelector('[data-cl="snap"]').onclick = () => {
      this.actions(''); this.view.tip(isKeyMode() ? 'A·D로 방향 · Space를 꾹 눌러 힘을 모았다가 초록에서 떼기' : '공 근처에서 위로 쓸어 올리세요! 오른쪽 막대 초록에서 놓기', 3.5);
      this.view.snap().then(r => {
        const L = this.line, ok = !!r.good;
        inc(L, 'fga'); if (ok) { inc(L, 'fgm'); L.fglong = Math.max(L.fglong || 0, dist); this.pf += 3; }
        this.snap(ok ? (Math.abs(r.offset ?? 9) < 1.3 ? 'perfect' : 'good') : 'miss', ok, false);
        const why = r.blocked ? '블록당했다' : r.why === 'short' ? '짧았다' : r.why === 'left' ? '왼쪽으로 빗나갔다' : r.why === 'right' ? '오른쪽으로 빗나갔다' : '골대를 맞고 나왔다';
        this.endDrive(ok ? `${dist}야드 필드골 성공${r.doink ? ' (골대 맞고 들어갔다!)' : ''}` : `${dist}야드 필드골 실패 · ${why}`);
      });
    };
  }
  // ───────── 펀터 ─────────
  puntSetup(story) {
    const start = 22 + Math.floor(R() * 18), wind = Math.round((R() - .5) * 20 * this.D.kick.wind);
    this.d = { ball: start, down: 4, toGo: 6, first: start + 6, goal: false };
    this.board(`4th & 6 · ${this.spot(start)}`);
    this.clearView();
    this.view = new KickPlay(this.$('cl-live'), { mode: 'punt', start, wind, me: { attrs: this.p.attrs, ovr: this.p.ovr }, colors: this.me.colors, oppColors: this.oppColors, diff: this.D.kick });
    this.msg(`<b>${esc(story)}</b><br>펀트. 금색으로 칠한 상대 20야드 안쪽을 노리세요. 엔드존에 들어가면 터치백. 바람 ${wind === 0 ? '없음' : `${wind > 0 ? '→' : '←'} ${Math.abs(wind)}km/h`}.`);
    this.actions(`<button class="primary" data-cl="snap">스냅!</button>`);
    this.root.querySelector('[data-cl="snap"]').onclick = () => {
      this.actions(''); this.view.tip(isKeyMode() ? 'A·D로 방향 · Space 꾹 → 초록에서 떼면 펀트! 비스듬히 차면 사이드라인 쪽으로' : '위로 쓸어 올려 펀트! 비스듬히 차면 사이드라인 쪽으로', 3.5);
      this.view.snap().then(r => {
        const L = this.line;
        let land, text;
        if (r.blocked) { land = Math.max(1, start - 12); text = '펀트가 막혔다!'; }
        else { land = r.final; text = `${r.gross}야드 펀트${r.in20 ? ', 20야드 안쪽' : r.tb ? ', 터치백' : r.oob ? ', 사이드라인 밖' : r.fair ? ', 페어 캐치' : r.ret ? `, ${r.ret}야드 리턴` : ''}`; inc(L, 'punts'); inc(L, 'puntyds', r.gross); if (r.in20) inc(L, 'in20'); }
        // 상대 시작 위치(자기 진영 기준) → 그 드라이브의 실점 확률
        const oppStart = 100 - land, risk = oppStart >= 50 ? [.38, .22] : oppStart >= 30 ? [.22, .2] : oppStart >= 20 ? [.14, .16] : [.07, .1];
        const roll = R(), allowed = roll < risk[0] ? 7 : roll < risk[0] + risk[1] ? 3 : 0; this.pa += allowed;
        const net = r.blocked ? -99 : r.net;
        this.snap(r.in20 || net >= 42 ? 'perfect' : net >= 34 ? 'good' : 'miss', !!r.in20, !!r.blocked);
        this.endDrive(`${text}${allowed ? ` · 그 드라이브에서 ${allowed}점 실점` : ''}`);
      });
    };
  }
  snap(zone, good, bad, takeaway = false) { this.snaps.push({ zone, good, bad, takeaway }); }
  // ───────── 결과 ─────────
  grade() {
    if (!this.snaps.length) return 60;
    const v = { perfect: 92, good: 74, miss: 46 };
    const avg = this.snaps.reduce((n, x) => n + v[x.zone], 0) / this.snaps.length;
    const bonus = this.snaps.filter(x => x.good).length * 2.5 + this.snaps.filter(x => x.takeaway).length * 3 - this.snaps.filter(x => x.bad).length * 5;
    return Math.round(clamp(avg + bonus, 32, 99) * 10) / 10;
  }
  finish(auto) {
    if (this.closed) return;
    this.closed = true;
    window.removeEventListener('keydown', this.onKey); this.offMode?.();
    if (this.practice) { this.clearView(); this.root.innerHTML = ''; return this.done(null); }
    this.clearView();
    if (auto && this.drive === 0 && !this.snaps.length) { this.root.innerHTML = ''; return this.done(null); }
    // 아직 남은 장면은 자동으로: 공격·수비 각각 평범한 결과로 채웁니다.
    for (let i = this.drive; i < this.drivesTotal; i++) {
      if (this.mode === 'offense') this.pf += R() < .35 ? 7 : R() < .3 ? 3 : 0;
      else if (this.mode === 'defense') this.pa += R() < .3 ? 7 : R() < .25 ? 3 : 0;
      else if (this.mode === 'kick') { inc(this.line, 'fga'); if (R() < .8) { inc(this.line, 'fgm'); this.pf += 3; } }
