<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>실시간 플레이 미리보기</title><link rel="stylesheet" href="../css/app.css">
<body style="background:#101814;color:#fff;padding:12px"><div class="clutch" style="position:static"><div id="host" class="cl-live"></div><pre id="out"></pre></div>
<script type="module">
// 개발용: 실시간 플레이 한 번을 바로 띄웁니다. ?pos=QB|WR|RB|CB|EDGE&concept=flood
import { runLivePlay, CONCEPTS } from '../js/ui/liveplay.js';
const q = new URLSearchParams(location.search), pos = q.get('pos') || 'QB';
const control = { QB: 'QB', RB: 'RB', WR: 'WR', TE: 'TE', CB: 'CB', S: 'S', LB: 'LB', EDGE: 'DL', DT: 'DL' }[pos];
const off = !['CB', 'S', 'LB', 'EDGE', 'DT'].includes(pos);
window.result = runLivePlay(document.getElementById('host'), { ball: 30, toGo: 10, concept: CONCEPTS.find(c => c.id === (q.get('concept') || 'flood')), defCall: 'man', control, edge: pos === 'EDGE', side: off ? 'O' : 'D',
  me: { attrs: { spd: 80, agi: 78, hands: 80, route: 75, arm: 80, acc: 80, vis: 75, str: 70, cov: 78, ball: 75, tkl: 75, rush: 78 }, ovr: 78 }, teamRating: 70, oppRating: 70,
  offColors: off ? ['#002244', '#69BE28'] : ['#E31837', '#FFB81C'], defColors: off ? ['#E31837', '#FFB81C'] : ['#002244', '#69BE28'], endzone: ['#002244', '#E31837'], away: 'D' })
  .then(r => { document.getElementById('out').textContent = JSON.stringify(r, null, 1); return r; });
</script>
